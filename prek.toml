minimum_prek_version = "0.4.14"

exclude = { glob = ["LICENSE", "mise.lock"] }

[update]
cooldown_days = 7
freeze = true
include_tags = "v*"
exclude_tags = ["*-{alpha,beta,rc}*"]
# repos = { "https://github.com/python-jsonschema/check-jsonschema" = { include_tags = "*" } }

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-json" },
  # { id = "check-json5" },
  { id = "check-toml" },
  # { id = "check-yaml" },
]

