minimum_prek_version = "0.5.5"

exclude = { glob = ["LICENSE", "mise.lock"] }

[update]
cooldown_days = 7
freeze = true
include_tags = "v*"
exclude_tags = ["*-{alpha,beta,rc}*"]
repos = { "https://github.com/python-jsonschema/check-jsonschema" = { include_tags = "*" } }

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-json" },
  # { id = "check-json5" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0494aa7fa1314e98913a41227d8f0a515b2c1049"  # frozen: 0.38.2
hooks = [
  { id = "check-github-workflows" },
  # { id = "check-renovate" },
]

# zizmor detects security vulnerabilities in GitHub Actions workflows
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "fa412071e4f5d44d44f9e365f4676f9df92456a2"  # frozen: v1.30.1
hooks = [
  { id = "zizmor", args = ["--no-progress", "--fix"] },
]
